<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#087443;--green-dark:#04552f;--green-light:#e9f7ef;--red:#e63946;--orange:#f59e0b;--blue:#2563eb;--bg:#f3f5f7;--card:#fff;--text:#17202a;--muted:#6b7280;--border:#e5e7eb;--shadow:0 4px 18px rgba(0,0,0,.06)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
/* header */
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.navbar{max-width:1250px;margin:auto;height:68px;display:flex;align-items:center;padding:0 20px;gap:20px}
.logo{font-size:23px;font-weight:900;color:var(--green);white-space:nowrap;text-decoration:none}
.logo span{color:#17202a}
.nav-links{display:flex;gap:15px}
.nav-links a{text-decoration:none;color:#555;font-size:13px;font-weight:700;transition:.2s}
.nav-links a:hover,.nav-links a.active{color:var(--green)}
.sbox{position:relative;margin-left:auto}
.search{width:150px;padding:10px 15px;border:1px solid var(--border);border-radius:22px;outline:none;font-size:13px}
.search:focus{border-color:var(--green)}
.sr{position:absolute;top:46px;right:0;width:290px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:none;max-height:320px;overflow:auto}
.sr a{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;font-size:13px;font-weight:700;color:var(--text);text-decoration:none;border-bottom:1px solid #f0f1f3}
.sr a:hover{background:var(--green-light)}
.sr small{color:#9ca3af;font-size:10px;font-weight:800;white-space:nowrap}
.menu{display:none;background:none;border:1px solid var(--border);border-radius:8px;font-size:18px;padding:5px 10px;cursor:pointer}
/* hero */
.hero{background:linear-gradient(120deg,#04552f,#087443 55%,#12955c);color:#fff}
.hero-inner{max-width:1250px;margin:auto;padding:38px 20px}
.hero-small{font-size:11px;letter-spacing:1.5px;font-weight:800;opacity:.8}
.hero h1{font-size:34px;margin-top:7px}
.hero p{margin-top:8px;opacity:.82;font-size:14px}
/* layout */
.container{max-width:1250px;margin:25px auto;padding:0 20px}
.main-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:20px}
.stack>*+*{margin-top:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:16px;font-weight:800}
.more{font-size:10px;color:var(--green);font-weight:900;text-decoration:none}
.live{display:flex;align-items:center;gap:6px;color:var(--red);font-size:11px;font-weight:900}
.live-dot{width:7px;height:7px;background:var(--red);border-radius:50%}
/* live match */
.match-body{padding:23px}
.match-series{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.teams{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;text-align:center;margin:24px 0}
.team-name{font-size:17px;font-weight:850}
.team-flag{font-size:38px;display:block;margin-bottom:7px}
.score{font-size:29px;font-weight:950;margin-top:7px}
.overs{color:var(--muted);font-size:11px;margin-top:2px}
.vs{color:#9ca3af;font-size:11px;font-weight:900}
.match-status{background:var(--green-light);color:var(--green);border-radius:8px;padding:11px;text-align:center;font-size:13px;font-weight:800}
.ball-row{display:flex;gap:8px;margin-top:16px;align-items:center}
.ball-label{font-size:11px;color:var(--muted);margin-right:5px;font-weight:700}
.ball{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;border:1px solid var(--border)}
.ball.four{color:var(--blue);background:#eff6ff}
.ball.six{color:#7c3aed;background:#f5f3ff}
.ball.wicket{color:var(--red);background:#fff1f2}
.tabs{display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:0 20px;gap:25px}
.tab{background:none;border:none;padding:14px 0;cursor:pointer;font-size:12px;font-weight:800;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.commentary{padding:5px 0}
.comment{padding:14px 20px;border-bottom:1px solid #f0f1f3}
.comment:last-child{border-bottom:none}
.over-number{color:var(--green);font-size:10px;font-weight:900;margin-bottom:5px}
.comment-text{font-size:13px;line-height:1.5;color:#374151}
.score-table{width:100%;border-collapse:collapse;font-size:12px}
.score-table th{color:#9ca3af;font-size:10px;text-transform:uppercase;padding:12px 20px;background:#fafafa}
.score-table td{padding:12px 20px;border-bottom:1px solid #f0f1f3}
.score-table th:not(:first-child),.score-table td:not(:first-child){text-align:right}
.score-table tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.player{font-weight:800}
.player small{display:block;color:#9ca3af;font-size:9px;font-weight:500;margin-top:2px}
.info{padding:20px;font-size:13px;line-height:1.8}
/* fixtures & news */
.fixture{display:block;color:inherit;text-decoration:none;padding:16px 18px;border-bottom:1px solid #f0f1f3}
.fixture:last-child{border-bottom:none}
a.fixture:hover{background:#fafafa}
.fixture-meta{display:flex;justify-content:space-between;color:#9ca3af;font-size:10px;font-weight:800}
.fixture-teams{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;font-weight:800}
.fixture-time{color:var(--green);font-size:11px}
.fixture .res{margin-top:8px;font-size:11px;color:var(--muted);font-weight:700}
.news-item{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:15px 17px;border-bottom:1px solid #f0f1f3}
.news-item:last-child{border-bottom:none}
.news-image{width:70px;height:58px;border-radius:9px;background:linear-gradient(135deg,#d1fae5,#a7f3d0);display:grid;place-items:center;font-size:26px}
.news-title{font-size:13px;font-weight:800;line-height:1.35}
.news-time{display:block;margin-top:6px;color:#9ca3af;font-size:10px}
.news-body{margin-top:6px;font-size:12px;line-height:1.55;color:#4b5563}
/* sections */
.section-title{margin:30px 0 14px;font-size:19px;font-weight:850}
.three-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.two-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.mini-card{padding:19px}
.badge{display:inline-block;background:var(--green-light);color:var(--green);padding:5px 7px;border-radius:5px;font-size:9px;font-weight:900;margin-bottom:10px}
.badge.red{background:#fff1f2;color:var(--red)}
.mini-card h3{font-size:15px;margin-bottom:8px}
.mini-card p{color:var(--muted);font-size:12px;line-height:1.6}
.mini-card .more{display:inline-block;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:#fff;border:1px solid var(--border);border-radius:20px;padding:8px 15px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.chip.active{background:var(--green);border-color:var(--green);color:#fff}
.form{display:flex;gap:5px;margin-top:12px}
.form b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;background:var(--red)}
.form b.W{background:var(--green)}
.empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px}
footer{margin-top:40px;background:#111827;color:#9ca3af;padding:30px 20px}
.footer-inner{max-width:1250px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12px;line-height:1.7}
.footer-inner strong{color:#fff}
.footer-inner a{color:#9ca3af;text-decoration:none;margin-right:14px}
.footer-inner a:hover{color:#fff}
.hero-inner{display:flex;align-items:center;justify-content:space-between;gap:30px}
.hero-art{width:300px;flex:none}.hero-art svg{width:100%;display:block}
.btn{display:inline-block;background:var(--green);color:#fff;border:1px solid var(--green);border-radius:22px;padding:11px 20px;font-size:13px;font-weight:800;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--green-dark)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--green)}.btn.sm{padding:9px 16px}
.av{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;text-decoration:none;flex:none}
.av.big{width:84px;height:84px}.big{width:96px;height:96px}
.fld{display:block;margin-bottom:14px;font-size:12px;font-weight:800;color:var(--muted)}
.fld input,.chatf input{display:block;width:100%;margin-top:6px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none}
.fld input:focus,.chatf input:focus{border-color:var(--green)}
.err{color:var(--red);font-size:12px;font-weight:700;min-height:18px;margin-bottom:10px}
.art{background:linear-gradient(120deg,#04552f,#12955c);color:#fff}.art p{color:#e9f7ef}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 18px;margin-top:10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--text)}
.opt:hover,.opt.on{border-color:var(--green);background:var(--green-light);color:var(--green)}
.bar{height:8px;background:#eef0f2;border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--green)}
.msg{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid #f0f1f3}
.msg b{font-size:12px;color:var(--green)}.msg small{color:#9ca3af;font-size:10px;margin-left:6px}.msg p{font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.chatbox{max-height:380px;overflow:auto}
.chatf{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}.chatf input{margin:0}
.bdgs{display:flex;flex-wrap:wrap;gap:16px;padding:20px}
.bdg{display:grid;justify-items:center;gap:6px;font-size:11px;font-weight:800;width:72px;text-align:center}
.bdg span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c);color:var(--c);background:#fff}
.bdg span svg{width:26px;stroke:currentColor;stroke-width:1.8}.bdg.off{opacity:.35;filter:grayscale(1)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid #f0f1f3;font-size:13px}
.row:last-child{border-bottom:none}.row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:0 23px 10px}
.pgrid .opt{margin:0;text-align:center;padding:14px 0;font-size:16px;font-weight:900}
.lock{padding:30px 20px;text-align:center}.lock svg{width:110px;margin:0 auto 12px;display:block}
#acct{display:flex}
.hero{position:relative;overflow:hidden}.hero-inner{position:relative}
.hero-inner.rich{min-height:300px;padding:45px 20px}
.hero-text{position:relative;z-index:3;max-width:580px}
.hero-inner.rich h1{font-size:42px;line-height:1.05;letter-spacing:-1.5px;margin-top:10px}
.hero-inner.rich p{max-width:500px;line-height:1.6}
.player-svg{position:absolute;right:80px;bottom:-20px;width:260px;height:290px;z-index:2;animation:pf 4s ease-in-out infinite}
@keyframes pf{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.stadium{position:absolute;right:-30px;bottom:-80px;width:500px;opacity:.22}
.ball-animation{position:absolute;right:360px;top:55px;width:22px;height:22px;background:#fff;border-radius:50%;z-index:4;animation:bf 3.5s ease-in-out infinite;box-shadow:0 0 15px rgba(255,255,255,.8)}
@keyframes bf{0%{transform:translate(0,80px)}50%{transform:translate(100px,-30px)}100%{transform:translate(230px,100px)}}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}.live-dot{animation:pulse 1.3s infinite}
.trophy{display:flex;align-items:center;gap:15px;padding:18px}.trophy svg{width:55px;height:65px;flex:none}
.tbtn{background:none;border:1px solid var(--border);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px;color:var(--text);flex:none}

.comment-text,.news-body{color:#c3d1df}

.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.opt:hover,.opt.on{background:var(--green-light);border-color:var(--green);color:var(--green)}
.bdg span{background:var(--card)}.bar{background:rgba(255,255,255,.1)}
.badge.red{background:rgba(255,93,108,.15)}
.art{background:linear-gradient(120deg,#06182b,#0e5a8f)}.art p{color:#c3d1df}
footer{background:#050c14}}
.wheel svg{width:100%;max-width:300px;display:block;margin:0 auto 16px;color:var(--text)}.wheel path{cursor:pointer}.wp{width:100%;color:var(--text)}.fld input[type=range]{padding:0;border:0;accent-color:var(--green)}
@media(max-width:850px){
.hero-art{display:none}.pgrid{padding:0 18px 10px}.player-svg{right:-30px;opacity:.45}.stadium{right:-180px}.hero-inner.rich h1{font-size:31px}.ball-animation{right:40%}
.menu{display:block}
.nav-links{display:none}
.nav-links.open{display:flex;flex-direction:column;gap:16px;position:absolute;top:68px;left:0;right:0;background:#fff;padding:18px 20px;border-bottom:1px solid var(--border)}
.navbar{gap:12px}.search{width:150px}
.main-grid,.three-grid,.two-grid{grid-template-columns:1fr}
.hero h1{font-size:27px}}
@media(max-width:500px){
.player-svg{width:200px;right:-60px}.hero-inner.rich{min-height:280px}
.search{width:115px}.sr{width:250px}
.teams{grid-template-columns:1fr 45px 1fr}
.score{font-size:23px}.team-name{font-size:14px}.team-flag{font-size:30px}
.ball-row{gap:5px}.ball{width:27px;height:27px}
.tabs{gap:16px}.score-table th,.score-table td{padding:12px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.player-svg,.ball-animation,.live-dot{animation:none}}
</style>

 else b=card('Watch Parties',[['India Women vs Australia Women • 2nd T20I','Live now'],['England vs South Africa • 1st ODI','Oct 7, 1:30 PM'],['MI vs CSK','Oct 8, 7:30 PM']].map(p=>`<div class="row"><div><b>${p[0]}</b><small>${p[1]}</small></div><button class="btn sm${S.joined.includes(p[0])?' ghost':''}" data-act="join" data-v="${p[0]}">${S.joined.includes(p[0])?'Joined':'Join'}</button></div>`).join(''));
 return page(hero('FAN ZONE','Cheer with other fans','Chat during matches, climb the leaderboard and join watch parties.'),chips(['Live Chat','Leaderboard','Watch Parties','Squads'],S.fz,'fz')+b)},
predict:()=>gate('PREDICT','Predict the next ball','Pick an outcome and lock it in. Correct picks earn 25 points, any pick earns 5.',()=>{
 const h=USER.preds.slice(-5).reverse(),l=S.last;
 return `<div class="main-grid"><section>${card('India Women vs Australia Women • 18.2 overs',`<div class="match-body"><div class="match-status">India Women need 5 runs from 10 balls</div></div><div class="pgrid">${['0','1','2','4','6','W'].map(o=>`<button class="opt${S.pick==o?' on':''}" data-pick="${o}">${o}</button>`).join('')}</div><div class="match-body"><button class="btn" data-act="lock"${S.pick?'':' disabled'}>Lock prediction</button>${l?`<p class="match-series" style="margin-top:14px">${l.ok?'Correct':'Not this time'}: you picked ${l.p} and the ball was ${l.o}. ${l.ok?'+25':'+5'} points.</p>`:''}</div>`)}</section><aside>${card('Your recent picks',h.length?h.map(p=>`<div class="row"><span>You picked ${p.p}</span><b style="color:var(--${p.ok?'green':'red'})">${p.o} • ${p.ok?'Correct':'Missed'}</b></div>`).join(''):`<div class="empty">${IC.stumps.replace('<svg','<svg width="64"')}<br>No picks yet. Choose an outcome to start.</div>`)}</aside></div>`}),
rewards:()=>gate('REWARDS','Your rewards','Level up by predicting, chatting and taking the quiz.',()=>{
 const Q=[['Prediction Master','Make 5 ball predictions',USER.preds.length,5],['Cricket Scholar','Take the fan type quiz',USER.type?1:0,1],['Fan Zone Explorer','Send a message in the Fan Zone',Math.min(USER.msgs,1),1]];
 return card(`Level ${lvl()} • ${lname()}`,`<div class="match-body"><b>${USER.xp} points</b><div class="bar"><i style="width:${USER.xp%100}%"></i></div><p class="overs">${100-USER.xp%100} points to the next level</p></div>`)+'<h2 class="section-title">Quests</h2>'+card('Quests',Q.map(q=>`<div class="row"><div><b>${q[0]}</b><small>${q[1]}</small><div class="bar" style="width:220px;max-width:60vw"><i style="width:${Math.min(q[2]/q[3],1)*100}%"></i></div></div><b style="color:var(--green)">${Math.min(q[2],q[3])}/${q[3]}</b></div>`).join(''))+'<h2 class="section-title">Badges</h2>'+card('Badges',`<div class="bdgs">${bdg().map(b=>`<div class="bdg${b[3]?'':' off'}" style="--c:${b[1]}"><span>${svg('0 0 24 24',GL[b[0]])}</span>${b[2]}</div>`).join('')}</div>`)}),
profile:()=>gate('PROFILE','Your profile','Account and fan details.',()=>card('Account',`<div class="row"><span class="av big" style="font-size:36px">${esc(USER.name[0]).toUpperCase()}</span><div style="flex:1"><b style="font-size:18px">${esc(USER.name)}</b><small>${esc(USER.email)}</small></div></div>${[['Level',`${lvl()} • ${lname()}`],['Points',USER.xp],['Fan type',USER.type||'Not set'],['Favourite team',USER.team?fl(USER.team):'Not set'],['Predictions',USER.preds.length]].map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}<div class="row"><a class="btn ghost sm" href="#/discover" data-act="again">Retake quiz</a><button class="btn sm" data-act="out">Log out</button></div>`))});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id=='af'){const v=n=>f.elements[n]?f.elements[n].value.trim():'',em=v('email'),pw=v('pw'),nm=v('name'),su=S.am=='Sign up';
  const bad=!/^\S+@\S+\.\S+$/.test(em)?'Enter a valid email address.':pw.length<6?'Use a password with at least 6 characters.':su&&!nm?'Enter your name.':'';
  if(bad){$('#err').textContent=bad;return}
  USER={name:nm||em.split('@')[0],email:em,team:'',type:'',xp:0,preds:[],msgs:0};save();location.hash=su?'#/discover':'#/profile';render()}
 if(f.id=='cf'){const v=f.elements.m.value.trim();if(!USER){location.hash='#/login';return}if(!v)return;
  CH.push([USER.name,new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),v]);USER.msgs++;xp(5);render();const c=$('.chatbox');c.scrollTop=c.scrollHeight;$('#cf input').focus()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-pick]');if(!b)return;const d=b.dataset;
 if(d.pick){S.pick=d.pick;render();return}
 if(d.act=='lock'){const o=['0','0','0','1','1','1','2','4','6','W'][Math.random()*10|0],ok=o==S.pick;USER.preds.push({p:S.pick,o,ok});xp(ok?25:5);S.last={p:S.pick,o,ok};S.pick='';render()}
 if(d.act=='ans'){S.ans.push(+d.i);S.q++;if(S.q>=3){const c=[0,0,0,0];S.ans.forEach(i=>c[i]++);const i=c.indexOf(Math.max(...c));if(!USER.type)USER.xp+=50;USER.type=TY[i][0];save()}render()}
 if(d.act=='zone'){S.zone=+d.v;render()}
 if(d.act=='team'){USER.team=d.v;save();render()}
 if(d.act=='again'){S.q=0;S.ans=[];render()}
 if(d.act=='join'){const i=S.joined.indexOf(d.v);i<0?S.joined.push(d.v):S.joined.splice(i,1);render()}
 if(d.act=='out'){USER=null;save();S.q=0;S.ans=[];location.hash='#/login';render()}});

const th=()=>{$('#theme').textContent=document.documentElement.dataset.theme=='dark'?'☀':'☾'};
$('#theme').onclick=()=>{const n=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('cp_theme',n)}catch(e){}th()};th();
const FY={'Power Player':['Boundary watch','See where the runs are coming from in Match Lab','#/match-lab'],'Tactician':['Tactics board','Replay how the chase swung over by over','#/match-lab'],'Team Spirit':['Watch parties','Join a watch party for the next match','#/fan-zone'],'Underdog Fan':['Comeback stories','Read about chases from behind','#/news']};
const fy=()=>{if(!USER||!USER.type)return card('For you',`<div class="empty">Take the 3-question fan quiz to personalise your matches, stories and challenges.<br><br><a class="btn sm" href="#/${USER?'discover':'login'}">${USER?'Take the quiz':'Log in to personalise'}</a></div>`);
 const x=FY[USER.type],m=USER.team&&M.find(m=>m.s!='done'&&(m.a==USER.team||m.b==USER.team));
 return card('For you • '+USER.type,`<a class="fixture" href="${x[2]}"><b>${x[0]}</b><div class="res">${x[1]}</div></a>${m?`<a class="fixture" href="#/matches"><b>Your team next</b><div class="res">${fl(m.a)} vs ${fl(m.b)} • ${m.d} ${m.t||''}</div></a>`:''}<a class="fixture" href="#/fan-zone"><b>Fan squads</b><div class="res">Join a squad and climb the table.</div></a>`)};
const Z=['Third man','Point','Cover','Long off','Long on','Mid-wicket','Square leg','Fine leg'],WD={'Smriti Mandhana':[4,12,16,10,8,14,6,2],'Harmanpreet Kaur':[2,4,6,5,3,8,4,2]},WP=[50,52,49,47,50,55,53,51,48,50,46,44,47,52,58,55,60,68,74];
Object.assign(S,{lb:'Smriti Mandhana',zone:2});
const wx=i=>10+i*280/18,wy=i=>100-WP[i]*.9;
const wheel=(d,z)=>{const mx=Math.max(...d),pt=(a,q)=>[150+q*Math.cos(a),150+q*Math.sin(a)];
 return svg('0 0 300 300',d.map((v,i)=>{const a0=(i*45-112.5)*Math.PI/180,q=40+v/mx*105,A=pt(a0,q),B=pt(a0+Math.PI/4,q);return `<path role="button" aria-label="${Z[i]}, ${v} runs" data-act="zone" data-v="${i}" d="M150 150L${A}A${q} ${q} 0 0 1 ${B}Z" fill="#22d3ee" fill-opacity="${i==z?.95:.2+.4*v/mx}" stroke="currentColor" stroke-opacity=".4"/>`}).join('')+'<circle cx="150" cy="150" r="120" stroke="currentColor" stroke-opacity=".3"/><rect x="144" y="120" width="12" height="60" rx="3" fill="currentColor" fill-opacity=".25"/>')};
P['match-lab']=()=>{const d=WD[S.lb],t=d.reduce((a,b)=>a+b),z=S.zone;
 return page(hero('MATCH LAB','Explore the match','Tap the wagon wheel and drag the slider to replay how the chase swung.'),
 `<div class="two-grid">${card('Wagon wheel',`<div class="match-body">${chips(Object.keys(WD),S.lb,'lb')}<div class="wheel">${wheel(d,z)}</div><div class="match-status">${Z[z]}: ${d[z]} of ${t} runs (${Math.round(d[z]/t*100)}%)</div></div>`)}${card('Win probability',`<div class="match-body"><svg viewBox="0 0 300 110" class="wp" aria-hidden="true"><path d="M10 55H290" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="4 4"/><polyline fill="none" stroke="#22d3ee" stroke-width="2.5" points="${WP.map((v,i)=>wx(i)+','+wy(i)).join(' ')}"/><circle id="wpc" r="5" fill="#e63946" cx="${wx(18)}" cy="${wy(18)}"/></svg><label class="fld">Over of the chase<input id="ov" type="range" min="0" max="18" value="18"></label><div class="match-status" id="wpt">Over 19: India Women 74% • Australia Women 26%</div></div>`)}</div>`)};
document.addEventListener('input',e=>{if(e.target.id!='ov')return;const i=+e.target.value;$('#wpc').setAttribute('cx',wx(i));$('#wpc').setAttribute('cy',wy(i));$('#wpt').textContent=`Over ${i+1}: India Women ${WP[i]}% • Australia Women ${100-WP[i]}%`});
/* ============ ROUTER & EVENTS ============ */
const cur=()=>(location.hash.replace(/^#\/?/,'')||'').split('/')[0];
function render(){
 const r=cur(),k=P[r||'home']?r||'home':'home';
 $('#app').innerHTML=P[k]();
 $$('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.r==(k=='home'?'':k=='match'?'matches':k)));
 $('#nav').classList.remove('open');
 $('#acct').innerHTML=USER?`<a class="av" href="#/profile" title="Profile">${esc(USER.name[0]).toUpperCase()}</a>`:'<a class="btn sm" href="#/login">Log in</a>';
 document.title='CricketPulse — '+(k=='home'?'Live Cricket':k[0].toUpperCase()+k.slice(1).replace('-',' '));
}
$('#nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" data-r="${n[0]}">${n[1]}</a>`).join('');
$('#fnav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}">${n[1]}</a>`).join('');
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
document.addEventListener('click',e=>{
 const c=e.target.closest('.chip');if(c){S[c.dataset.k]=c.dataset.v;render();return}
 const t=e.target.closest('.tab');
 if(t){$$('.tab').forEach(b=>b.classList.toggle('active',b==t));['commentary','scorecard','info'].forEach(id=>$('#'+id).style.display=id==t.dataset.t?'block':'none')}
 if(!e.target.closest('.sbox'))$('#sr').style.display='none';
});
/* search */
const IDX=[...PL.map(p=>[p[0],'Player','players']),...Object.keys(T).slice(0,6).map(c=>[T[c][0],'Team','teams']),...N.map(n=>[n[2],'News','news']),...SE.map(s=>[s[1],'Series','series'])];
$('#q').oninput=e=>{
 const v=e.target.value.trim().toLowerCase(),box=$('#sr');
 if(v.length<2){box.style.display='none';return}
 const h=IDX.filter(x=>x[0].toLowerCase().includes(v)).slice(0,8);
 box.innerHTML=h.length?h.map(x=>`<a href="#/${x[2]}" onclick="$('#q').value='';$('#sr').style.display='none'">${x[0]}<small>${x[1]}</small></a>`).join(''):'<div class="empty">No results. Try a player, team or series name.</div>';
 box.style.display='block';
};
render();
